name: scan

on:
  # РАСПИСАНИЕ ОТКЛЮЧЕНО. Чтобы включить обратно — снять «#» со строк ниже.
  # Кнопка «Run workflow» на вкладке Actions продолжает работать вручную.
  # schedule:
    # РЕЗЕРВ. Основной сканер работает на компьютере и шлёт сигналы через
    # секунды после закрытия бара; облако тормозит на 5-13 минут и вдобавок
    # выбрасывает часть запусков. Поэтому здесь редкий интервал: облако
    # просыпается, видит свежий state.json от компьютера и молча выходит.
    # Работать по-настоящему оно начнёт, только если компьютер выключен.
    # - cron: "*/15 * * * *"
  workflow_dispatch:        # даёт кнопку «запустить сейчас» на вкладке Actions

# Нужно, чтобы workflow мог закоммитить обратно журнал сигналов и состояние
permissions:
  contents: write

# Если предыдущий запуск ещё идёт, новый ждёт: иначе два процесса
# одновременно правили бы signals.csv и мешали друг другу коммитить
concurrency:
  group: scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Сканировать и отправить
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          # Если последний бар в state.json свежее 40 минут — значит компьютер
          # жив и уже всё отправил. Облако в этом случае не шлёт ничего:
          # иначе на каждый сигнал приходило бы по два сообщения.
          SKIP_IF_FRESH_MINUTES: "40"
        run: python scan.py

      - name: Сохранить журнал
        run: |
          git config user.name  "oz-scanner"
          git config user.email "actions@github.com"
          # add -A, а не перечисление файлов: signals.csv появляется только
          # когда был хотя бы один сигнал, и на пустом запуске явное
          # перечисление роняло шаг с кодом 128
          git add -A
          git diff --staged --quiet && echo "изменений нет" && exit 0
          git commit -m "signals $(date -u '+%Y-%m-%d %H:%M') UTC"
          # Между расчётом и коммитом мог пройти другой запуск — подтянем его
          git pull --rebase --autostash origin ${{ github.ref_name }} || true
          git push
