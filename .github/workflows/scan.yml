name: scan

on:
  schedule:
    # Каждые 5 минут, хотя бар закрывается раз в 15. Причина в поведении
    # GitHub: запуски по расписанию не только задерживаются на 5-13 минут,
    # но и просто выбрасываются под нагрузкой — из 32 слотов за 8 часов
    # реально отработали 12. Чаще слоты — больше шансов, что один сработает
    # вскоре после закрытия бара. Повторов это не создаёт: сканер помнит,
    # о каком баре уже сообщал.
    - cron: "*/5 * * * *"
  workflow_dispatch:        # даёт кнопку «запустить сейчас» на вкладке Actions

# Нужно, чтобы workflow мог закоммитить обратно журнал сигналов и состояние
permissions:
  contents: write

# Если предыдущий запуск ещё идёт, новый ждёт: иначе два процесса
# одновременно правили бы signals.csv и мешали друг другу коммитить
concurrency:
  group: scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Сканировать и отправить
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: python scan.py

      - name: Сохранить журнал
        run: |
          git config user.name  "oz-scanner"
          git config user.email "actions@github.com"
          # add -A, а не перечисление файлов: signals.csv появляется только
          # когда был хотя бы один сигнал, и на пустом запуске явное
          # перечисление роняло шаг с кодом 128
          git add -A
          git diff --staged --quiet && echo "изменений нет" && exit 0
          git commit -m "signals $(date -u '+%Y-%m-%d %H:%M') UTC"
          # Между расчётом и коммитом мог пройти другой запуск — подтянем его
          git pull --rebase --autostash origin ${{ github.ref_name }} || true
          git push
